{# Formulario para registrar buses nuevos. #}
{% extends "base.html" %}
{% block title %}Anadir Bus{% endblock %}
{% block content %}
<h2>Registrar nuevo Bus</h2>
<form method="POST" class="mt-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label>ID del Bus</label>
        <input type="number" name="id" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Placa</label>
        <input type="text" name="plate" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Conductor</label>
        <input type="text" name="driver" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Descripcion (opcional)</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Modelo, observaciones, detalles operativos..."></textarea>
    </div>
    {% if error %}
        <p class="text-danger">{{ error }}</p>
    {% endif %}
    <button type="submit" class="btn btn-primary">Guardar</button>
</form>
{% endblock %}
