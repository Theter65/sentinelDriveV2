<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SENTINLDRIVE - Sistema de monitoreo y gestión segura de flota vehicular en Ecuador">
    <title>SENTINLDRIVE - {% block title %}{% endblock %}</title>
    
    <!-- Bootstrap 5.3 CSS (CDN con integridad para seguridad) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    
    <!-- Bootstrap Icons (para consistencia visual) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Estilos personalizados del proyecto -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Favicon (recomendado para branding profesional) -->
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- Sidebar (navegación lateral fija) -->
    <div class="bg-dark text-white p-3 vh-100 position-fixed" style="width: 250px; overflow-y: auto;">
        <h4 class="text-center mb-4 fw-bold">
            <i class="bi bi-bus-front-fill me-2"></i>SENTINLDRIVE
        </h4>
        
        <ul class="nav flex-column">
            <!-- Opciones siempre visibles -->
            <li class="nav-item">
                <a href="{{ url_for('dashboard.dashboard') }}" class="nav-link text-white {% if request.path == url_for('dashboard.dashboard') %}active{% endif %}">
                    <i class="bi bi-house-door-fill me-2"></i> Inicio
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('events.events') }}" class="nav-link text-white {% if request.path == url_for('events.events') %}active{% endif %}">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> Eventos
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('tracking.tracking') }}" class="nav-link text-white {% if request.path == url_for('tracking.tracking') %}active{% endif %}">
                    <i class="bi bi-geo-alt-fill me-2"></i> Seguimiento
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('reports.reports') }}" class="nav-link text-white {% if request.path == url_for('reports.reports') %}active{% endif %}">
                    <i class="bi bi-graph-up me-2"></i> Reportes
                </a>
            </li>

            <!-- Opciones exclusivas para administradores -->
            {% if session.get('role')|lower == 'admin' %}
            <hr class="text-secondary my-3">
            <li class="nav-item">
                <a href="{{ url_for('buses.buses') }}" class="nav-link text-white {% if request.path == url_for('buses.buses') %}active{% endif %}">
                    <i class="bi bi-truck-front-fill me-2"></i> Gestión de Buses
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('maintenance.maintenance') }}" class="nav-link text-white {% if request.path == url_for('maintenance.maintenance') %}active{% endif %}">
                    <i class="bi bi-tools me-2"></i> Mantenimientos
                </a>
            </li>
            <li class="nav-item">
                <a href="{{ url_for('users.users') }}" class="nav-link text-white {% if request.path == url_for('users.users') %}active{% endif %}">
                    <i class="bi bi-people-fill me-2"></i> Usuarios
                </a>
            </li>
            {% endif %}

            <!-- Cerrar sesión (siempre visible) -->
            <hr class="text-secondary my-3">
            <li class="nav-item">
                <a href="{{ url_for('auth.logout') }}" class="nav-link text-danger">
                    <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
                </a>
            </li>
        </ul>
    </div>

    <!-- Contenido principal (con margen para sidebar fija) -->
    <div class="flex-fill p-4" style="margin-left: 250px;">
        {% block content %}{% endblock %}
    </div>
</div>

<!-- Bootstrap JS Bundle (necesario para modales, tooltips, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
        crossorigin="anonymous"></script>
</body>
</html>
